version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      dependencies:
        patterns: ["*"]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet
      - dependency-name: typescript
        versions: [">= 7"]
      # the action runs on node24
      - dependency-name: "@types/node"
        versions: [">= 25"]

  # Only hassfest publishes versioned tags. The catalog image has none, so
  # self-images.yml follows its digest instead.
  - package-ecosystem: docker
    directory: /images
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: ghcr.io/hacs/action
    commit-message:
      prefix: "deps"
      include: "scope"
